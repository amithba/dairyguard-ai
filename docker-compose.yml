services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dairyguard-backend
    env_file:
      - backend/.env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dairyguard-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
